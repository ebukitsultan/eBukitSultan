<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>eBukitSultan - Warga Blok B</title>

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#4F46E5">
  <meta name="msapplication-TileColor" content="#4F46E5">
  <meta name="msapplication-TileImage" content="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="eBukitSultan">
  <meta name="description" content="Administrasi Warga Blok B Bukit Sultan">

  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-192.png">

  <link rel="apple-touch-startup-image" href="icons/splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)">
  <link rel="apple-touch-startup-image" href="icons/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="apple-touch-startup-image" href="icons/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="apple-touch-startup-image" href="icons/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="apple-touch-startup-image" href="icons/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="apple-touch-startup-image" href="icons/splash-1536x2048.png" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2)">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary: #4F46E5;
      --primary-light: #6366F1;
      --primary-dark: #4338CA;
      --accent: #7C3AED;
      --accent-pink: #EC4899;
      --bg: #0A0E1A;
      --surface: #FFFFFF;
      --text: #0F172A;
      --text-muted: #64748B;
      --success: #10B981;
      --danger: #EF4444;
      --gradient-1: linear-gradient(135deg, #4F46E5 0%, #7C3AED 50%, #EC4899 100%);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #FFFFFF;
      overflow: hidden;
      position: relative;
    }

    body {
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0A0E1A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transition: opacity 0.5s ease, transform 0.5s ease;
      overflow: hidden;
      will-change: opacity, transform;
    }

    #splash-screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(79,70,229,0.34), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(124,58,237,0.25), transparent 40%);
      animation: bgPulse 8s ease-in-out infinite;
    }

    @keyframes bgPulse {
      0%, 100% { opacity: 0.75; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    #splash-screen.fade-out {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }

    #splash-screen.hide-complete {
      display: none;
    }

    .splash-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 24px;
      min-height: 60vh;
    }

    .splash-logo-wrapper {
      position: relative;
      margin-bottom: 22px;
    }

    .splash-logo {
      width: 118px;
      height: 118px;
      border-radius: 30px;
      object-fit: cover;
      display: block;
      background: #FFFFFF;
      padding: 12px;
      box-shadow:
        0 18px 50px rgba(79, 70, 229, 0.35),
        0 0 0 3px rgba(255,255,255,0.12);
      animation: logoFloat 3s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }

    .splash-title {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -1px;
      color: #FFFFFF;
      margin-bottom: 8px;
      line-height: 1.1;
    }

    .splash-title span {
      background: linear-gradient(135deg, #818CF8, #C084FC, #F0ABFC);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .splash-subtitle {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      margin-bottom: 28px;
      letter-spacing: 0.3px;
    }

    .progress-circle-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 18px;
    }

    .progress-circle {
      width: 80px;
      height: 80px;
      transform: rotate(-90deg);
    }

    .progress-circle-track {
      fill: none;
      stroke: rgba(255,255,255,0.12);
      stroke-width: 6;
    }

    .progress-circle-progress {
      fill: none;
      stroke: url(#progressGradient);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 226;
      stroke-dashoffset: 226;
      transition: stroke-dashoffset 0.35s ease;
    }

    .progress-percent {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      color: #FFFFFF;
    }

    .progress-percent::after {
      content: '%';
      font-size: 11px;
      margin-left: 1px;
      opacity: 0.7;
    }

    .loading-text {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.3px;
      min-height: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .loading-text::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10B981;
      animation: pulseDot 1.2s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.7); }
    }

    .splash-footer {
      position: absolute;
      bottom: 30px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      font-weight: 500;
      color: rgba(255,255,255,0.45);
    }

    .splash-footer .heart {
      color: #EC4899;
      display: inline-block;
      animation: heartBeat 1.2s ease-in-out infinite;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.18); }
      50% { transform: scale(1); }
      75% { transform: scale(1.1); }
    }

    .splash-footer .developer {
      background: linear-gradient(135deg, #818CF8, #C084FC);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
      letter-spacing: 0.8px;
    }

    #appIframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #F1F5F9;
      display: block;
      opacity: 0;
      transition: opacity 0.8s ease;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      z-index: 1;
    }

    #appIframe.loaded {
      opacity: 1;
    }

    #btnInstall {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      background: var(--gradient-1);
      color: white;
      border: none;
      padding: 14px 26px;
      border-radius: 999px;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow:
        0 12px 32px rgba(79, 70, 229, 0.45),
        0 0 0 1px rgba(255,255,255,0.08);
      letter-spacing: 0.3px;
      white-space: nowrap;
      animation: btnFloat 3s ease-in-out infinite;
    }

    #btnInstall.show {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @keyframes btnFloat {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-4px); }
    }

    @media (max-width: 480px) {
      .splash-logo {
        width: 100px;
        height: 100px;
      }
      .splash-title {
        font-size: 30px;
      }
      .splash-subtitle {
        font-size: 12px;
      }
      .progress-circle-wrapper,
      .progress-circle {
        width: 70px;
        height: 70px;
      }
      .progress-percent {
        font-size: 16px;
      }
      .splash-footer {
        font-size: 10px;
        bottom: 24px;
      }
    }

    @media (min-width: 769px) {
      body {
        background: linear-gradient(135deg, #0A0E1A 0%, #1E1B4B 50%, #312E81 100%);
        padding: 24px;
      }

      #appIframe {
        max-width: 480px;
        border-radius: 28px;
        box-shadow:
          0 40px 120px rgba(0,0,0,0.4),
          0 0 0 1px rgba(255,255,255,0.05);
        position: relative;
        height: 90vh;
        min-height: 600px;
        max-height: 95vh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; -ms-overflow-style: none; }
  </style>
</head>
<body>

  <div id="splash-screen">
    <svg width="0" height="0" style="position:absolute;pointer-events:none;">
      <defs>
        <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#4F46E5"/>
          <stop offset="50%" stop-color="#7C3AED"/>
          <stop offset="100%" stop-color="#EC4899"/>
        </linearGradient>
      </defs>
    </svg>

    <div class="splash-content">
      <div class="splash-logo-wrapper">
        <img src="icons/icon-512.png" class="splash-logo" alt="eBukitSultan Logo" id="splashLogo" onerror="this.src='https://lh3.googleusercontent.com/d/1t8_cVCIU7gPwWKpLTStCd99soJBKkrMc'">
      </div>
      <div class="splash-title">eBukit<span>Sultan</span></div>
      <div class="splash-subtitle">Amanah Dalam Kelola · Transparan Dalam Data</div>

      <div class="progress-circle-wrapper">
        <svg class="progress-circle" viewBox="0 0 80 80">
          <circle class="progress-circle-track" cx="40" cy="40" r="36"></circle>
          <circle class="progress-circle-progress" id="progressCircle" cx="40" cy="40" r="36"></circle>
        </svg>
        <div class="progress-percent" id="progressPercent">0</div>
      </div>

      <div class="loading-text" id="loadingText">Memuat aplikasi</div>

      <div class="splash-footer">
        Developed With <span class="heart">❤️</span> By <span class="developer">AF-AHFZB2NO2</span>
      </div>
    </div>
  </div>

  <iframe
      id="appIframe"
      src="https://script.google.com/macros/s/AKfycbzZ32DozSeyMZ2U8fZo9DgeKHoyedL5dc-SpPhiGagHFKtLHEEenw88pOKWpTu3Nu1M1g/exec"
      allowfullscreen="true"
      loading="eager"
      scrolling="yes"
      allow="cross-origin-isolated; storage-access; clipboard-write; camera; microphone; geolocation"
      referrerpolicy="no-referrer-when-downgrade"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads allow-storage-access-by-user-activation allow-top-navigation allow-top-navigation-by-user-activation"
      style="width:100%; height:100%; border:none;"
      title="eBukitSultan App"
  ></iframe>

  <button id="btnInstall" onclick="installApp()">
    <span>📲</span>
    <span>Install Aplikasi</span>
  </button>

  <script>
    (function() {
      var SPLASH_MIN_DURATION = 5000;
      var SPLASH_DELAY_AFTER_LOAD = 1500;
      var SPLASH_MAX_DURATION = 10000;
      var SPLASH_MSG_INTERVAL = 2500;

      var splashScreen = document.getElementById('splash-screen');
      var iframe = document.getElementById('appIframe');
      var loadingText = document.getElementById('loadingText');
      var progressCircle = document.getElementById('progressCircle');
      var progressPercent = document.getElementById('progressPercent');
      var splashHidden = false;
      var splashStartTime = Date.now();
      var iframeLoaded = false;
      var loadTimeoutId = null;
      var progressInterval = null;
      var messageInterval = null;
      var currentProgress = 0;
      var CIRCLE_LENGTH = 226;

      function updateProgress(percent) {
        currentProgress = Math.min(percent, 100);
        if (progressCircle) {
          var offset = CIRCLE_LENGTH - (CIRCLE_LENGTH * currentProgress / 100);
          progressCircle.style.strokeDashoffset = offset;
        }
        if (progressPercent) {
          progressPercent.textContent = Math.round(currentProgress);
        }
      }

      function hideSplash(force) {
        if (splashHidden) return;

        var elapsed = Date.now() - splashStartTime;
        var remaining = SPLASH_MIN_DURATION - elapsed;

        if (!force && remaining > 0) {
          setTimeout(function() {
            hideSplash(true);
          }, remaining);
          return;
        }

        splashHidden = true;

        clearInterval(messageInterval);
        clearInterval(progressInterval);
        clearTimeout(loadTimeoutId);

        updateProgress(100);

        if (loadingText) {
          loadingText.textContent = 'Siap!';
        }

        if (iframe) {
          iframe.classList.add('loaded');
        }

        setTimeout(function() {
          splashScreen.classList.add('fade-out');
          setTimeout(function() {
            splashScreen.classList.add('hide-complete');
            splashScreen.style.display = 'none';
          }, 500);
        }, 200);

        console.log('✅ Splash hidden after ' + Math.round(elapsed / 1000) + ' detik');
      }

      if (iframe) {
        iframe.addEventListener('load', function() {
          iframeLoaded = true;
          console.log('✅ Iframe loaded');

          clearInterval(progressInterval);

          if (currentProgress < 95) {
            updateProgress(95);
          }

          setTimeout(function() {
            updateProgress(100);
            if (loadingText) {
              loadingText.textContent = 'Siap!';
            }
            setTimeout(function() {
              hideSplash(true);
            }, 300);
          }, SPLASH_DELAY_AFTER_LOAD);
        });

        iframe.addEventListener('error', function() {
          clearInterval(messageInterval);
          clearInterval(progressInterval);
          if (loadingText) {
            loadingText.textContent = 'Gagal memuat, coba refresh';
          }
          setTimeout(function() {
            hideSplash(true);
          }, 2000);
        });
      }

      var loadingMessages = [
        'Memuat aplikasi',
        'Menyiapkan data',
        'Menghubungkan server',
        'Memuat konfigurasi',
        'Hampir selesai',
        'Menyiapkan tampilan'
      ];

      var messageIndex = 0;
      messageInterval = setInterval(function() {
        if (splashHidden) return;
        messageIndex = (messageIndex + 1) % loadingMessages.length;
        if (loadingText) {
          loadingText.textContent = loadingMessages[messageIndex];
        }
      }, SPLASH_MSG_INTERVAL);

      progressInterval = setInterval(function() {
        if (splashHidden) return;

        var elapsed = Date.now() - splashStartTime;
        var targetProgress = Math.min(90, (elapsed / SPLASH_MIN_DURATION) * 90);

        if (targetProgress > currentProgress) {
          updateProgress(targetProgress);
        }
      }, 200);

      loadTimeoutId = setTimeout(function() {
        if (!splashHidden) {
          console.warn('⏰ Splash timeout, force hide');
          if (iframe) iframe.classList.add('loaded');
          hideSplash(true);
        }
      }, SPLASH_MAX_DURATION);

      window.hideSplash = hideSplash;
    })();

    var deferredPrompt;

    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      var btn = document.getElementById('btnInstall');
      if (btn) btn.classList.add('show');
    });

    window.addEventListener('appinstalled', function() {
      var btn = document.getElementById('btnInstall');
      if (btn) btn.classList.remove('show');
    });

    function installApp() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(result) {
        deferredPrompt = null;
        var btn = document.getElementById('btnInstall');
        if (btn) btn.classList.remove('show');
      });
    }

    setTimeout(function() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
          .then(function(registration) {
            console.log('✅ Service worker registered:', registration);
          })
          .catch(function(error) {
            console.error('❌ Service worker registration failed:', error);
          });
      }
    }, 300);

    if (document.requestStorageAccess) {
      document.requestStorageAccess().then(function() {
        console.log('✅ Storage access granted');
      }).catch(function(err) {
        console.log('⚠️ Storage access denied:', err.message);
      });
    }

    window.addEventListener('popstate', function() {
      if (window.history.length > 1) {
        window.history.back();
      }
    });

    console.log('✅ eBukitSultan app initialized');
  </script>
</body>
</html>
