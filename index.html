<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>eBukitSultan - Warga Blok B</title>

    <!-- ===== PWA META TAGS ===== -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="eBukitSultan">
    <meta name="theme-color" content="#2563EB">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1t8_cVCIU7gPwWKpLTStCd99soJBKkrMc=s192-c">

    <!-- ============================================================
    HAPUS SERVICE WORKER & CACHE
    ============================================================ -->
    <script>
        (function() {
            // Hapus Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    for (var i = 0; i < registrations.length; i++) {
                        registrations[i].unregister();
                        console.log('✅ Service Worker di-unregister');
                    }
                }).catch(function(err) {
                    console.log('⚠️ Gagal unregister Service Worker:', err);
                });
            }

            // Hapus Cache Storage
            if ('caches' in window) {
                caches.keys().then(function(names) {
                    for (var i = 0; i < names.length; i++) {
                        caches.delete(names[i]);
                        console.log('✅ Cache dihapus:', names[i]);
                    }
                }).catch(function(err) {
                    console.log('⚠️ Gagal hapus cache:', err);
                });
            }

            // Hapus session & local storage
            try {
                sessionStorage.clear();
                var sessionData = localStorage.getItem('ebukitsultan_session');
                localStorage.clear();
                if (sessionData) {
                    localStorage.setItem('ebukitsultan_session', sessionData);
                }
                console.log('✅ Storage dihapus');
            } catch(e) {}

            // ============================================================
            // REDIRECT KE WEB APP
            // ============================================================
            var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzvPG5Mm8E1TItwmqM3yP0BB95hp8MaoIejkquJmRhiiuhVhHPq4buetmP3Cx4C_0Y7Bg/exec';

            if (window.location.href.indexOf('script.google.com') === -1) {
                window.location.replace(WEB_APP_URL);
            }
        })();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #F8FAFC;
            padding: 20px;
        }
        .loading-card {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            max-width: 400px;
            width: 100%;
        }
        .logo {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            color: #0F172A;
        }
        h1 span {
            background: linear-gradient(135deg, #2563EB, #7C3AED);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sub {
            font-size: 14px;
            color: #94A3B8;
            margin: 8px 0 24px;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #E8ECF1;
            border-top: 4px solid #2563EB;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 13px;
            color: #64748B;
            font-weight: 500;
        }
        .footer {
            margin-top: 24px;
            font-size: 10px;
            color: #94A3B8;
        }
        .btn-install {
            margin-top: 16px;
            padding: 12px 32px;
            background: linear-gradient(135deg, #2563EB, #7C3AED);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-install.hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="loading-card">
        <img src="https://lh3.googleusercontent.com/d/1t8_cVCIU7gPwWKpLTStCd99soJBKkrMc" class="logo" alt="Logo">
        <h1>eBukit<span>Sultan</span></h1>
        <p class="sub">Amanah Dalam Kelola · Transparan Dalam Data</p>
        <div class="loading-spinner"></div>
        <div class="loading-text">⏳ Mengalihkan ke aplikasi...</div>
        <div class="footer">🤖 eBukitSultan v3.3.4</div>
        <button id="btnInstall" class="btn-install hidden" onclick="installApp()">📲 Install Aplikasi</button>
    </div>

    <script>
        // Fallback: jika redirect gagal
        setTimeout(function() {
            var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzvPG5Mm8E1TItwmqM3yP0BB95hp8MaoIejkquJmRhiiuhVhHPq4buetmP3Cx4C_0Y7Bg/exec';
            if (window.location.href.indexOf('script.google.com') === -1) {
                window.location.href = WEB_APP_URL;
            }
        }, 5000);

        // ============================================================
        // INSTALL APP (PWA)
        // ============================================================
        var deferredPrompt;

        window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            deferredPrompt = e;
            var btn = document.getElementById('btnInstall');
            if (btn) btn.classList.remove('hidden');
        });

        function installApp() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(function(result) {
                if (result.outcome === 'accepted') {
                    console.log('✅ Aplikasi berhasil diinstall');
                } else {
                    console.log('❌ Pengguna membatalkan install');
                }
                deferredPrompt = null;
                var btn = document.getElementById('btnInstall');
                if (btn) btn.classList.add('hidden');
            });
        }
    </script>

</body>
</html>
