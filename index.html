  <script>
    (function() {
      // Hapus Service Worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
            console.log('✅ Service Worker di-unregister');
          }
        }).catch(function(err) {
          console.log('⚠️ Gagal unregister Service Worker:', err);
        });
      }

      // Hapus Cache Storage
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var i = 0; i < names.length; i++) {
            caches.delete(names[i]);
            console.log('✅ Cache dihapus:', names[i]);
          }
        }).catch(function(err) {
          console.log('⚠️ Gagal hapus cache:', err);
        });
      }

      // Hapus session storage yang tidak perlu
      try {
        sessionStorage.clear();
        console.log('✅ Session storage dihapus');
      } catch(e) {}

      // Hapus localStorage yang tidak perlu (kecuali session login)
      try {
        var sessionData = localStorage.getItem('ebukitsultan_session');
        localStorage.clear();
        if (sessionData) {
          localStorage.setItem('ebukitsultan_session', sessionData);
          console.log('✅ Session data disimpan, localStorage lain dihapus');
        }
        console.log('✅ Local storage dihapus');
      } catch(e) {}

      // Force reload jika halaman dimuat dari cache
      window.addEventListener('load', function() {
        var perfEntries = performance.getEntriesByType('navigation');
        if (perfEntries.length > 0 && perfEntries[0].type === 'back_forward') {
          location.reload(true);
        }
      });
    })();
  </script>

  <script>
    // ============================================================
    // SPLASH SCREEN - HIDE AFTER IFRAME LOAD
    // ============================================================
    (function() {
      var splashScreen = document.getElementById('splash-screen');
      var iframe = document.getElementById('appIframe');
      var loadingText = document.getElementById('loadingText');
      var loadingProgress = document.getElementById('loadingProgress');
      var splashHidden = false;
      var loadTimeoutId = null;
      var progressInterval = null;
      var messageInterval = null;

      function hideSplash() {
        if (splashHidden) return;
        splashHidden = true;
        
        clearInterval(messageInterval);
        clearInterval(progressInterval);
        clearTimeout(loadTimeoutId);
        
        if (loadingText) loadingText.textContent = '✅ Selesai!';
        if (loadingProgress) loadingProgress.style.width = '100%';
        
        if (iframe) iframe.classList.add('loaded');
        
        splashScreen.classList.add('fade-out');
        setTimeout(function() {
          splashScreen.classList.add('hide-complete');
          splashScreen.style.display = 'none';
        }, 600);
      }

      // ===== PERBAIKAN: Coba deteksi iframe load dengan postMessage =====
      var iframeLoaded = false;

      // Listen for messages from iframe
      window.addEventListener('message', function(event) {
        if (event.data === 'iframeLoaded') {
          iframeLoaded = true;
          hideSplash();
        }
      });

      // Iframe load event
      if (iframe) {
        iframe.addEventListener('load', function() {
          clearInterval(progressInterval);
          if (loadingProgress) {
            loadingProgress.style.width = '100%';
          }
          if (loadingText) loadingText.textContent = '✅ Selesai!';
          
          // Tunggu sebentar lalu hide splash
          setTimeout(hideSplash, 500);
        });

        iframe.addEventListener('error', function() {
          clearInterval(messageInterval);
          clearInterval(progressInterval);
          if (loadingText) loadingText.textContent = '❌ Gagal memuat, coba refresh';
          setTimeout(hideSplash, 1500);
        });
      }

      // Loading messages
      var loadingMessages = [
        '⏳ Memuat aplikasi...',
        '⚡ Menyiapkan data...',
        '🚀 Hampir selesai...'
      ];
      var messageIndex = 0;

      messageInterval = setInterval(function() {
        if (splashHidden) return;
        messageIndex = (messageIndex + 1) % loadingMessages.length;
        if (loadingText) {
          loadingText.textContent = loadingMessages[messageIndex];
        }
      }, 2500);

      // Progress bar
      var progress = 0;
      progressInterval = setInterval(function() {
        if (splashHidden) {
          clearInterval(progressInterval);
          return;
        }
        progress = Math.min(progress + Math.random() * 6 + 1, 92);
        if (loadingProgress) {
          loadingProgress.style.width = progress + '%';
        }
      }, 300);

      // ===== FALLBACK: Force hide setelah 8 detik =====
      loadTimeoutId = setTimeout(function() {
        if (!splashHidden) {
          console.warn('⏰ Splash timeout, force hide');
          if (iframe) iframe.classList.add('loaded');
          hideSplash();
        }
      }, 8000);

      // Handle visibility change (user switches tab)
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible' && !splashHidden) {
          if (iframe && iframe.contentWindow) {
            try {
              iframe.contentWindow.postMessage('ping', '*');
            } catch(e) {}
          }
        }
      });

      console.log('✅ eBukitSultan wrapper loaded');
      console.log('📱 Device: ' + (navigator.userAgent || 'Unknown'));
      console.log('🔄 Iframe URL: ' + (iframe ? iframe.src : 'No iframe'));
      
      window.hideSplash = hideSplash;
    })();

    // ============================================================
    // FULLSCREEN
    // ============================================================
    function requestFullscreen(element) {
      if (!element) return;
      try {
        if (element.requestFullscreen) {
          element.requestFullscreen();
        } else if (element.webkitRequestFullscreen) {
          element.webkitRequestFullscreen();
        } else if (element.msRequestFullscreen) {
          element.msRequestFullscreen();
        }
      } catch (err) {
        console.log('Fullscreen tidak diizinkan:', err.message);
      }
    }

    var fullscreenAttempted = false;

    function attemptFullscreen() {
      if (fullscreenAttempted) return;
      var iframeEl = document.getElementById('appIframe');
      if (iframeEl && !document.fullscreenElement && !document.webkitFullscreenElement) {
        fullscreenAttempted = true;
        requestFullscreen(iframeEl);
      }
    }

    setTimeout(function() {
      attemptFullscreen();
    }, 3000);

    document.addEventListener('click', function() {
      attemptFullscreen();
    });

    document.addEventListener('touchstart', function() {
      attemptFullscreen();
    });

    // ============================================================
    // DETEKSI KEYBOARD OPEN
    // ============================================================
    if ('visualViewport' in window) {
      var initialHeight = window.visualViewport.height;
      var isKeyboardOpen = false;

      window.visualViewport.addEventListener('resize', function() {
        var currentHeight = window.visualViewport.height;
        var iframeEl = document.getElementById('appIframe');
        
        if (currentHeight < initialHeight * 0.7) {
          isKeyboardOpen = true;
          if (iframeEl) {
            iframeEl.style.height = '100vh';
            iframeEl.style.minHeight = '100vh';
            iframeEl.style.maxHeight = '100vh';
          }
        } else if (isKeyboardOpen && currentHeight >= initialHeight * 0.85) {
          isKeyboardOpen = false;
          if (iframeEl) {
            iframeEl.style.height = '';
            iframeEl.style.minHeight = '';
            iframeEl.style.maxHeight = '';
          }
        }
      });
    }

    // ============================================================
    // ORIENTATION CHANGE
    // ============================================================
    window.addEventListener('orientationchange', function() {
      setTimeout(function() {
        var iframeEl = document.getElementById('appIframe');
        if (iframeEl) {
          iframeEl.style.height = '100%';
          iframeEl.style.minHeight = '100vh';
          iframeEl.style.maxHeight = '100vh';
        }
        fullscreenAttempted = false;
        setTimeout(attemptFullscreen, 500);
      }, 400);
    });

    // ============================================================
    // RESIZE WINDOW
    // ============================================================
    window.addEventListener('resize', function() {
      var iframeEl = document.getElementById('appIframe');
      if (iframeEl && !isKeyboardOpen) {
        iframeEl.style.height = '100%';
        iframeEl.style.minHeight = '100vh';
        iframeEl.style.maxHeight = '100vh';
      }
    });

    // ============================================================
    // INSTALL APP
    // ============================================================
    var deferredPrompt;

    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      var btn = document.getElementById('btnInstall');
      if (btn) btn.classList.add('show');
    });

    window.addEventListener('appinstalled', function() {
      var btn = document.getElementById('btnInstall');
      if (btn) btn.classList.remove('show');
      console.log('✅ Aplikasi berhasil diinstall');
    });

    function installApp() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(result) {
        if (result.outcome === 'accepted') {
          console.log('✅ Aplikasi berhasil diinstall');
        } else {
          console.log('❌ Pengguna membatalkan install');
        }
        deferredPrompt = null;
        var btn = document.getElementById('btnInstall');
        if (btn) btn.classList.remove('show');
      });
    }

    // ============================================================
    // SERVICE WORKER - AUTO UNREGISTER
    // ============================================================
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
          console.log('✅ Service Worker di-unregister di awal');
        }
      }).catch(function(err) {
        console.log('⚠️ Gagal unregister Service Worker:', err);
      });
    }

    // ============================================================
    // MESSAGE FROM IFRAME
    // ============================================================
    window.addEventListener('message', function(event) {
      if (event.data === 'ping') {
        event.source.postMessage('pong', event.origin);
      }
      if (event.data === 'hideSplash') {
        if (window.hideSplash) {
          window.hideSplash();
        }
      }
    });
  </script>
</body>
</html>
