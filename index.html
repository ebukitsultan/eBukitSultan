      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var i = 0; i < names.length; i++) caches.delete(names[i]);
        }).catch(function() {});
      }
      try {
        sessionStorage.clear();
        var sessionData = localStorage.getItem('ebukitsultan_session');
        localStorage.clear();
        if (sessionData) localStorage.setItem('ebukitsultan_session', sessionData);

  <style>
    /* ============================================================
       RESET & BASE
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary: #4F46E5;

      --primary-dark: #4338CA;

      --bg: #0A0E1A;

      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #FFFFFF;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
    }

    body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      min-height: 100dvh;
      overflow: hidden;
      background: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ============================================================
       SPLASH SCREEN — MODERN
       ============================================================ */
    #splash-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 9999;
      background: #0A0E1A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 1;
      transform: scale(1);
      overflow: hidden;
    }

    #splash-screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(79, 70, 229, 0.4) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(124, 58, 237, 0.4) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.2) 0%, transparent 60%);
      animation: bgPulse 8s ease-in-out infinite;
    }

    @keyframes bgPulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    #splash-screen::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.3) 0%, transparent 50%),
        radial-gradient(2px 2px at 60% 70%, rgba(255,255,255,0.2) 0%, transparent 50%),
        radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.4) 0%, transparent 50%),
        radial-gradient(1px 1px at 80% 20%, rgba(255,255,255,0.3) 0%, transparent 50%),
        radial-gradient(2px 2px at 10% 60%, rgba(255,255,255,0.25) 0%, transparent 50%),
        radial-gradient(1px 1px at 90% 90%, rgba(255,255,255,0.3) 0%, transparent 50%);
      background-size: 200% 200%;
      animation: particlesFloat 20s ease-in-out infinite;
      opacity: 0.5;
    }

    @keyframes particlesFloat {
      0%, 100% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
    }

    #splash-screen.fade-out {
      opacity: 0;
      transform: scale(1.15);
      pointer-events: none;
    }

    #splash-screen.hide-complete {
      display: none;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 30px;
      animation: splashFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      z-index: 10;
      min-height: 60vh;
    }

    @keyframes splashFadeIn {
      from { opacity: 0; transform: translateY(40px) scale(0.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .splash-logo-wrapper {
      position: relative;
      margin-bottom: 24px;
    }

    .splash-logo-wrapper::before {
      content: '';
      position: absolute;
      inset: -20px;
      background: radial-gradient(circle, rgba(79, 70, 229, 0.6) 0%, transparent 70%);
      border-radius: 50%;
      animation: logoGlow 2.5s ease-in-out infinite;
      z-index: -1;
    }

    @keyframes logoGlow {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .splash-logo {
      width: 120px;
      height: 120px;
      border-radius: 32px;
      object-fit: cover;
      margin: 0 auto;
      box-shadow: 
        0 20px 60px rgba(79, 70, 229, 0.4),
        0 0 0 4px rgba(255,255,255,0.1),
        inset 0 2px 10px rgba(255,255,255,0.2);
      background: #FFFFFF;
      padding: 14px;
      animation: logoFloat 3s ease-in-out infinite;
      display: block;
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }

    .splash-title {
      font-family: var(--font);
      font-size: 36px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: -1px;
      margin-bottom: 8px;
      line-height: 1.1;
    }

    .splash-title span {
      background: linear-gradient(135deg, #818CF8, #C084FC, #F0ABFC);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 200% 200%;
      animation: gradientShift 3s ease infinite;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .splash-subtitle {
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.6);
      margin-bottom: 36px;
      letter-spacing: 0.5px;
    }

    .progress-circle-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
    }

    .progress-circle {
      width: 80px;
      height: 80px;
      transform: rotate(-90deg);
    }

    .progress-circle-track {
      fill: none;
      stroke: rgba(255,255,255,0.1);
      stroke-width: 6;
    }

    .progress-circle-progress {
      fill: none;
      stroke: url(#progressGradient);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 226;
      stroke-dashoffset: 226;
      transition: stroke-dashoffset 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      filter: drop-shadow(0 0 8px rgba(124, 58, 237, 0.8));
    }

    .progress-percent {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--font);
      font-size: 18px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.5px;
    }

    .progress-percent::after {
      content: '%';
      font-size: 11px;
      opacity: 0.6;
      margin-left: 1px;
    }

    .loading-text {
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.3px;
      min-height: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .loading-text::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 12px #10B981;
      animation: pulseDot 1.5s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.7); }
    }

    .splash-footer {
      font-family: var(--font);
      font-size: 11px;
      font-weight: 500;
      color: rgba(255,255,255,0.4);
      margin-top: 40px;

    @keyframes heartBeat {

    /* ============================================================
       IFRAME
       ============================================================ */
    #appIframe {
      width: 100%;
      height: 100%;

      min-height: 100dvh;
      border: none;
      display: block;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;

      will-change: opacity;
    }

    #appIframe.loaded {
      opacity: 1;
    }

    /* ============================================================
       INSTALL BUTTON
       ============================================================ */
    #btnInstall {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      background: var(--gradient-1);
      color: white;
      border: none;
      padding: 14px 26px;
      border-radius: 999px;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 
        0 12px 40px rgba(79, 70, 229, 0.5),
        0 0 0 1px rgba(255,255,255,0.1),
        inset 0 1px 0 rgba(255,255,255,0.2);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
      letter-spacing: 0.3px;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      animation: btnFloat 3s ease-in-out infinite;
    }

    #btnInstall.show {
      display: flex;
    }

    #btnInstall::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 999px;
      background: var(--gradient-1);
      opacity: 0.4;
      filter: blur(12px);
      z-index: -1;
      animation: btnGlow 2s ease-in-out infinite;
    }

    @keyframes btnGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }

    @keyframes btnFloat {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-4px); }
    }

    #btnInstall:active {
      transform: translateX(-50%) scale(0.95);

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 480px) {
      .splash-logo { width: 100px; height: 100px; padding: 12px; border-radius: 26px; }
      .splash-title { font-size: 30px; }
      .splash-subtitle { font-size: 12px; }
      .progress-circle-wrapper,
      .progress-circle { width: 70px; height: 70px; }
      .progress-circle-progress { stroke-dasharray: 198; stroke-dashoffset: 198; }
      .progress-percent { font-size: 16px; }
      .splash-footer { font-size: 10px; bottom: 24px; }
    }

    @media (min-width: 769px) {
      body {
        background: linear-gradient(135deg, #0A0E1A 0%, #1E1B4B 50%, #312E81 100%);
        padding: 24px;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      #appIframe {
        max-width: 480px;
        border-radius: 28px;
        box-shadow: 
          0 40px 120px rgba(0,0,0,0.4),

        position: relative;

      }
      .splash-logo { width: 140px; height: 140px; padding: 18px; }
      .splash-title { font-size: 42px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; -ms-overflow-style: none; }
  </style>

<body>

  <script>
    // ============================================================
    // SPLASH SCREEN — MODERN VERSION (DURASI CUSTOM)
    // ⏱️ UBAH DURASI DI 3 BARIS PALING ATAS
    // ============================================================
    (function() {
      // ⏱️ KONFIGURASI DURASI — Ubah di sini
      var SPLASH_MIN_DURATION = 4000;      // Minimum 4 detik (WAJIB tampil)
      var SPLASH_DELAY_AFTER_LOAD = 1500;  // Delay 1.5 detik setelah iframe load
      var SPLASH_MAX_DURATION = 15000;     // Maximum 15 detik (force hide)
      var SPLASH_MSG_INTERVAL = 2000;      // Ganti pesan setiap 2 detik

      var splashScreen = document.getElementById('splash-screen');
      var iframe = document.getElementById('appIframe');
      var loadingText = document.getElementById('loadingText');
      var progressCircle = document.getElementById('progressCircle');
      var progressPercent = document.getElementById('progressPercent');
      var splashHidden = false;
      var splashStartTime = Date.now();
      var iframeLoaded = false;
      var loadTimeoutId = null;
      var progressInterval = null;
      var messageInterval = null;
      var currentProgress = 0;
      var CIRCLE_LENGTH = 226; // 2 * PI * 36

      function updateProgress(percent) {
        currentProgress = Math.min(percent, 100);
        if (progressCircle) {
          var offset = CIRCLE_LENGTH - (CIRCLE_LENGTH * currentProgress / 100);
          progressCircle.style.strokeDashoffset = offset;
        }
        if (progressPercent) {
          progressPercent.textContent = Math.round(currentProgress);
        }
      }

      function hideSplash(force) {
        if (splashHidden) return;
        
        var elapsed = Date.now() - splashStartTime;
        var remaining = SPLASH_MIN_DURATION - elapsed;
        
        // ✅ Kalau belum mencapai minimum duration, tunda
        if (!force && remaining > 0) {
          console.log('⏱️ Splash minimum belum tercapai, tunggu ' + Math.round(remaining/1000) + ' detik lagi');
          setTimeout(function() { hideSplash(true); }, remaining);
          return;
        }
        
        splashHidden = true;
        
        clearInterval(messageInterval);
        clearInterval(progressInterval);
        clearTimeout(loadTimeoutId);
        
        updateProgress(100);
        if (loadingText) loadingText.textContent = 'Siap!';
        
        if (iframe) iframe.classList.add('loaded');
        
        setTimeout(function() {
          splashScreen.classList.add('fade-out');
          setTimeout(function() {
            splashScreen.classList.add('hide-complete');
            splashScreen.style.display = 'none';
          }, 600);
        }, 300);
        
        console.log('✅ Splash hidden after ' + Math.round(elapsed/1000) + ' detik');
      }

      if (iframe) {
        iframe.addEventListener('load', function() {
          iframeLoaded = true;
          console.log('✅ Iframe loaded, tunggu delay tambahan...');
          
          clearInterval(progressInterval);
          
          // ✅ Set progress ke 95% dulu (belum 100%)
          if (currentProgress < 95) updateProgress(95);
          
          // ✅ Tunggu SPLASH_DELAY_AFTER_LOAD sebelum hide
          setTimeout(function() {
            updateProgress(100);
            if (loadingText) loadingText.textContent = 'Siap!';
            setTimeout(hideSplash, 500);
          }, SPLASH_DELAY_AFTER_LOAD);
        });

        iframe.addEventListener('error', function() {
          clearInterval(messageInterval);
          clearInterval(progressInterval);
          if (loadingText) loadingText.textContent = 'Gagal memuat, coba refresh';
          setTimeout(function() { hideSplash(true); }, 2000);
        });
      }

      // ✅ Loading messages — tampil bergantian
      var loadingMessages = [
        'Memuat aplikasi',
        'Menyiapkan data',
        'Menghubungkan server',
        'Memuat konfigurasi',
        'Hampir selesai',
        'Menyiapkan tampilan'
      ];
      var messageIndex = 0;

      messageInterval = setInterval(function() {
        if (splashHidden) return;
        messageIndex = (messageIndex + 1) % loadingMessages.length;
        if (loadingText) loadingText.textContent = loadingMessages[messageIndex];
      }, SPLASH_MSG_INTERVAL);

      // ✅ Progress animation — smooth sampai 90%
      progressInterval = setInterval(function() {
        if (splashHidden) { clearInterval(progressInterval); return; }
        
        // Hitung progress berdasarkan waktu (lebih smooth)
        var elapsed = Date.now() - splashStartTime;
        var targetProgress = Math.min(90, (elapsed / SPLASH_MIN_DURATION) * 90);
        
        // Hanya update kalau lebih besar dari current
        if (targetProgress > currentProgress) {
          updateProgress(targetProgress);
        }
      }, 200);

      // ✅ Force hide setelah MAX duration
      loadTimeoutId = setTimeout(function() {
        if (!splashHidden) {
          console.warn('⏰ Splash timeout, force hide');
          if (iframe) iframe.classList.add('loaded');
          hideSplash(true);
        }
      }, SPLASH_MAX_DURATION);

      window.hideSplash = hideSplash;
    })();

    // ============================================================
    // FULLSCREEN
    // ============================================================
    function requestFullscreen(element) {
      if (!element) return;
      try {
        if (element.requestFullscreen) element.requestFullscreen();
        else if (element.webkitRequestFullscreen) element.webkitRequestFullscreen();
      } catch (err) {}
    }

    var fullscreenAttempted = false;
    function attemptFullscreen() {
      if (fullscreenAttempted) return;
      var iframeEl = document.getElementById('appIframe');
      if (iframeEl && !document.fullscreenElement && !document.webkitFullscreenElement) {
        fullscreenAttempted = true;
        requestFullscreen(iframeEl);
      }
    }
    setTimeout(attemptFullscreen, 3000);
    document.addEventListener('click', attemptFullscreen);
    document.addEventListener('touchstart', attemptFullscreen);

    // ============================================================
    // INSTALL APP
    // ============================================================
    var deferredPrompt;

    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      var btn = document.getElementById('btnInstall');
      if (btn) btn.classList.add('show');
    });

    window.addEventListener('appinstalled', function() {
      var btn = document.getElementById('btnInstall');
      if (btn) btn.classList.remove('show');
    });

    function installApp() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(result) {
        deferredPrompt = null;
        var btn = document.getElementById('btnInstall');
        if (btn) btn.classList.remove('show');
      });
    }

    // ============================================================
    // CHROME ANDROID FIXES
    // ============================================================
    setTimeout(function() {
      var iframe = document.getElementById('appIframe');
      if (iframe && !iframe.dataset.reloaded) {
        iframe.dataset.reloaded = '1';
        var originalSrc = iframe.src;
        iframe.src = 'about:blank';
        setTimeout(function() { iframe.src = originalSrc; }, 100);
      }
    }, 500);

    if (document.requestStorageAccess) {
      document.requestStorageAccess().then(function() {
        console.log('✅ Storage access granted');
      }).catch(function(err) {
        console.log('⚠️ Storage access denied:', err.message);
      });
    }

    var iframeLoadAttempts = 0;
    var maxIframeAttempts = 3;
    
    function checkIframeLoaded() {
      iframeLoadAttempts++;
      var iframe = document.getElementById('appIframe');
      if (!iframe) return;
      
      try {
        var iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
        if (!iframeDoc || iframeDoc.body.innerHTML.length < 100) {
          if (iframeLoadAttempts < maxIframeAttempts) {
            var src = iframe.src;
            iframe.src = 'about:blank';
            setTimeout(function() { iframe.src = src; }, 300);
            setTimeout(checkIframeLoaded, 3000);
          }
        }
      } catch(e) {
        // Cross-origin = normal
      }
    }
    
    setTimeout(checkIframeLoaded, 8000);
    
    window.addEventListener('popstate', function(e) {
      var iframe = document.getElementById('appIframe');
      if (iframe && iframe.contentWindow) {
        try {
          iframe.contentWindow.history.back();
          history.pushState(null, '', window.location.href);
        } catch(e) {}
      }
    });
    history.pushState(null, '', window.location.href);
  </script>
</body>
</html>
